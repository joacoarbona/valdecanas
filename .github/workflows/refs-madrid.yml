name: Referencias de los recorridos de Madrid (solo para consulta)
# Downloads the clubs' own hole drawings and scorecards so the routing of each hole can be checked by eye.
# They are not published: the bundle is encrypted with a public key whose private half never leaves the
# working machine, and only the ciphertext travels (on the throw-away branch refs-cifrado).
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/refs-madrid.yml'
permissions:
  contents: write
jobs:
  refs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar dibujos de hoyos y tarjetas
        run: |
          mkdir -p refs/negro refs/amarillo refs/pdf
          UA="Mozilla/5.0 (X11; Linux x86_64) valdecanas-family-game/1.0"
          for i in $(seq 1 ${N_HOLES:-0}); do
            curl -fsSL -A "$UA" "https://www.ccvm.es/sites/default/files/2023-12/n_hoyo_${i}.jpg" -o "refs/negro/n_hoyo_${i}.jpg" || echo "fail negro $i"
            curl -fsSL -A "$UA" "https://www.ccvm.es/sites/default/files/2024-04/Hoyo%20${i}.%20Recorrido%20Amarillo.png" -o "refs/amarillo/a_hoyo_${i}.png" || echo "fail amarillo $i"
          done
          curl -fsSL -A "$UA" "https://www.ccvm.es/sites/default/files/noticias/doc/580611Recorrido_negro.pdf" -o refs/pdf/ccvm_negro.pdf || echo "fail pdf negro"
          curl -fsSL -A "$UA" "https://www.ccvm.es/sites/default/files/2024-10/LA_CHAMBA_CCVM_076.jpg" -o refs/pdf/ccvm_photo.jpg || echo "fail photo"
          curl -fsSL -A "$UA" "https://opendeespana.com/wp-content/uploads/2026/10/PLANO_HORIZONTAL_2026.jpg" -o refs/pdf/open_plano_2026.jpg || echo "fail open jpg"
          curl -fsSL -A "$UA" "https://opendeespana.com/wp-content/pdf/PLANO_GOLF_2025.pdf" -o refs/pdf/open_plano_2025.pdf || echo "fail open pdf"
          ls -laR refs | head -80
      - name: Cifrar y subir a una rama temporal
        run: |
          cat > pub.pem <<'KEY'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAs/OJWbCgA8l/PnjvPfUx
          32CJuYsqBgmwXbHpHvJBPLYZLK6qUAl1+HtoWMvsRP3lnp8vh+O/bh0qY+OdvLXA
          quWVoZNi9Cd7vrLvMRUPh1O0yYbNKEw4YLVPMBAdTzy9M/yILogga/twPOQ0QIxi
          dfSqM/rhL940YTWeS70ZuhocSRts/bTrRBD/Xzqtvgq5N3HmwIvmEhFVJIxZPe4D
          6wCiRHF+KLQJ473S6DMt2HyPXhTHfkDAKzCx807iv24gSYA1Fkf1wn9It9DGDMhD
          DlreSmHsBntfmj/j0aAIDlOGpZDB+x1M1ULv37SmVos/sc1LZ7znf7K4IZ552w41
          IgtiNLlBj0AtZ2fAyT4p7Y2q/97GNw6jPCI6A8J9IcKBm+Mhp8Hzwrct8DXDVXhg
          xzIIHkIUB+kbAD2YuZnsVQ97gh2KHyVqyjElyiwN5wxCPoqSAB+flzA+x0veA72K
          aAUG5OygD+tY/2zo6yvJZelVK2l5HoDFbLd5LyEIkE0TAgMBAAE=
          -----END PUBLIC KEY-----
          KEY
          sed -i 's/^ *//' pub.pem
          tar czf refs.tgz refs
          openssl rand -out k.bin 32
          openssl enc -aes-256-cbc -pbkdf2 -salt -in refs.tgz -out refs.tgz.enc -pass file:k.bin
          openssl pkeyutl -encrypt -pubin -inkey pub.pem -pkeyopt rsa_padding_mode:oaep -in k.bin -out k.bin.enc
          mkdir out && mv refs.tgz.enc k.bin.enc out/ && cd out
          git init -q && git checkout -q -b refs-cifrado
          git config user.name "valdecanas-datos"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -q -m "referencias cifradas (temporal)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" refs-cifrado
