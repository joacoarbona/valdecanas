name: Descargar los alrededores de los campos de Madrid
on:
  push:
    paths:
      - 'scripts/fetch_geodata_madrid_wide.py'
      - '.github/workflows/geodata-madrid-wide.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python scripts/fetch_geodata_madrid_wide.py
      - name: Guardar los datos en el repo
        run: |
          git config user.name "valdecanas-datos"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add madrid/data
          git commit -m "Datos de Madrid: foto aérea (PNOA 4 m) y relieve (MDT 25 m) de 16 x 16 km alrededor de los campos" || echo "sin cambios"
          git pull --rebase origin main || true
          git push
      - name: Borrar la rama temporal de referencias cifradas
        run: git push origin --delete refs-cifrado || true
