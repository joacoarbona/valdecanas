<title>{{TITLE}} · Tarjeta en directo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --paper:#f5f7f1; --card:#ffffff; --ink:#16231b; --muted:#59665d; --line:#d7ddd2; --soft:#eef2ea;
  --accent:#255d3c; --accent2:#e5f1e7; --water:#2a6f87; --flag:#d6442a; --gold:#c9961c; --sand:#e8dab3;
  --shadow:0 6px 20px rgba(22,35,27,.10);
  --f-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif; --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);-webkit-tap-highlight-color:transparent}
body{min-height:100vh;padding:calc(64px + var(--st)) 0 calc(76px + var(--sb))}
button{font-family:inherit;color:var(--ink);cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--water);outline-offset:2px}
input,select{font-family:inherit;font-size:16px;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:#fff;color:var(--ink);min-width:0}
header#top{position:fixed;top:0;left:0;right:0;z-index:20;background:rgba(245,247,241,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:calc(8px + var(--st)) 14px 8px;display:flex;align-items:center;gap:10px}
#top h1{font-family:var(--f-display);font-weight:800;font-size:21px;line-height:1.05;margin:0}
#top .lbl{margin-bottom:1px}
#top .grow{flex:1;min-width:0}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 9px;background:#fff;white-space:nowrap}
.live i{width:9px;height:9px;border-radius:50%;background:#aab3ac}
.live.on i{background:#2fa35a;box-shadow:0 0 0 3px rgba(47,163,90,.2)}
nav#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + var(--sb))}
nav#tabs button{flex:1;border:0;background:none;padding:6px 2px;font-size:11.5px;font-weight:800;color:var(--muted);display:grid;justify-items:center;gap:2px;border-radius:10px}
nav#tabs button b{font-size:19px;line-height:1}
nav#tabs button.on{color:var(--accent);background:var(--accent2)}
main{max-width:720px;margin:0 auto;padding:12px 12px 20px;display:grid;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px}
.card h2{font-family:var(--f-display);font-size:20px;margin:0 0 8px}
.card h3{font-size:14px;margin:12px 0 6px}
.lbl{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:800}
.note{font-size:12.5px;color:var(--muted);line-height:1.45}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 15px;font-weight:800;font-size:15px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.small{padding:7px 11px;font-size:13px;border-radius:10px}
.btn.danger{color:var(--flag)}
.btn.block{width:100%}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 11px;font-size:13px;font-weight:800}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.hstrip{display:flex;gap:5px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.hstrip button{flex:0 0 auto;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:#fff;font-weight:800;font-size:14px}
.hstrip button.done{background:var(--accent2);border-color:#b9d6bf}
.hstrip button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.hole-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.hole-h b{font-family:var(--f-display);font-size:30px;line-height:1}
.hole-h span{font-weight:700;color:var(--muted)}
.gps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center;margin-top:10px}
.gps div{background:var(--soft);border-radius:12px;padding:8px 4px}
.gps b{display:block;font-family:var(--f-display);font-size:24px;line-height:1.05}
.gps small{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.gps .c{background:var(--accent);color:#fff} .gps .c small{color:#d8eadc}
.pl{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.pl:first-of-type{border-top:0}
.pl .nm{font-weight:800;font-size:16px} .pl .sub{font-size:12px;color:var(--muted);font-weight:700}
.pl .dots{color:var(--gold);letter-spacing:1px}
.stp{display:flex;align-items:center;gap:6px}
.stp button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:22px;font-weight:800;line-height:1}
.stp output{min-width:46px;text-align:center;font-family:var(--f-display);font-weight:800;font-size:28px}
.stp output.e{color:var(--muted)}
.stp.sm button{width:34px;height:34px;font-size:18px;border-radius:10px} .stp.sm output{min-width:30px;font-size:19px}
.res{font-size:12px;font-weight:800;border-radius:999px;padding:2px 8px;background:var(--soft)}
.res.b{background:#dcecf6;color:#1f5c75} .res.e{background:#2a6f87;color:#fff} .res.o{background:#f6ead0;color:#7a5a12} .res.o2{background:#c9961c;color:#fff}
.extra{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:6px;font-size:12.5px;font-weight:700;color:var(--muted)}
.fw button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 8px;font-weight:800;font-size:13px}
.fw button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.shotbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.shotbar .btn{padding:14px 10px;font-size:16px}
.shots{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;font-size:13px;font-weight:700}
.shots span{background:var(--soft);border-radius:8px;padding:4px 8px}
.board{display:grid;gap:4px}
.board .r{display:grid;grid-template-columns:28px 1fr auto auto;gap:8px;align-items:center;padding:8px 10px;border-radius:12px;background:var(--soft)}
.board .r.me{outline:2px solid var(--accent)}
.board .pos{font-family:var(--f-display);font-weight:800;font-size:18px;text-align:center}
.board .v{font-family:var(--f-display);font-weight:800;font-size:22px}
.board .th{font-size:12px;color:var(--muted);font-weight:800}
.tw{overflow-x:auto;margin:0 -4px}
table.sc{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:13px}
table.sc th,table.sc td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:center;white-space:nowrap}
table.sc th:first-child,table.sc td:first-child{text-align:left}
table.sc tfoot td,table.sc tr.sum td{font-weight:800;background:var(--soft)}
table.sc small{display:block;font-size:10px;color:var(--muted);font-weight:800}
.sc i{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:50%;font-style:normal;font-weight:800}
.sc i.b{border:2px solid var(--water);color:var(--water)} .sc i.e{background:var(--water);color:#fff} .sc i.o{border:2px solid var(--gold);border-radius:4px} .sc i.o2{background:var(--gold);color:#fff;border-radius:4px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.kv div{background:var(--soft);border-radius:12px;padding:9px 10px}
.kv b{display:block;font-family:var(--f-display);font-size:22px}
.kv small{font-size:11.5px;color:var(--muted);font-weight:700}
.list{display:grid;gap:8px}
.item{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:#fff;text-align:left;width:100%}
.item b{font-size:15px} .item small{display:block;color:var(--muted);font-weight:700;font-size:12px;margin-top:2px}
.prow{display:grid;grid-template-columns:1fr 78px 1fr;gap:6px;align-items:end;border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.prow label{display:grid;gap:3px;font-size:11px;font-weight:800;color:var(--muted)}
.prow .me{grid-column:1/-1;display:flex;gap:10px;align-items:center;font-size:13px;font-weight:700;color:var(--ink)}
canvas.map{width:100%;height:auto;border-radius:12px;display:block;touch-action:manipulation;background:#cfd8c9}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;font-weight:700;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:5px;vertical-align:-2px}
.legend i.l{border-radius:2px;height:4px;width:16px;vertical-align:2px}
#toast{position:fixed;left:50%;top:calc(74px + var(--st));transform:translateX(-50%);z-index:40;background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;box-shadow:var(--shadow);max-width:90vw;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
.qr{display:grid;place-items:center;padding:8px} .qr svg,.qr img{width:200px;height:200px}
.code{font-family:var(--f-display);font-size:34px;font-weight:800;letter-spacing:.08em;text-align:center}
dl.gl dt{font-weight:800;margin-top:9px} dl.gl dd{margin:2px 0 0;color:var(--muted);font-size:14px;line-height:1.45}
.warn{background:#fff6e6;border:1px solid #f0d9a8;border-radius:12px;padding:9px 11px;font-size:13px;font-weight:700;color:#6b4f12}
svg.chart text{font-family:var(--f-body);font-size:11px;fill:var(--muted)}
</style>
<header id="top"><div class="grow"><div class="lbl" id="topLbl">{{TITLE}}</div><h1 id="topTitle">Tarjeta en directo</h1></div><span class="live" id="live" hidden><i></i><span id="liveTxt"></span></span></header>
<main id="view"><div class="card"><p class="note">Cargando los campos…</p></div></main>
<nav id="tabs"></nav>
<div id="toast" role="status"></div>
