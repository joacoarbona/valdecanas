function statsHTML(o,one){ const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0; const drives=o.drives;
  let h='<div class="kv"><div><b>'+(o.holes?o.g:'—')+'</b><small>golpes'+(o.holes?' ('+rel(o.g-o.par)+')':'')+(one?'':' en total')+'</small></div><div><b>'+(o.puH?fmt(o.pu/(one?1:Math.max(1,o.rounds)),one?0:1):'—')+'</b><small>putts'+(one?'':' por vuelta')+(o.puH?' · '+fmt(o.pu/o.puH,2)+' por hoyo':'')+'</small></div>'+
   '<div><b>'+pct(o.gir,o.girH)+'</b><small>greens en regulación</small></div><div><b>'+pct(o.fw,o.fwH)+'</b><small>calles (izq. '+o.fwL+' · der. '+o.fwR+')</small></div><div><b>'+pct(o.scr,o.scrH)+'</b><small>scrambling</small></div><div><b>'+o.p3+'</b><small>tres putts</small></div>'+
   '<div><b>'+(drives.length?fmt(avg(drives)):'—')+'</b><small>drive medio (m)'+(drives.length?' · máx. '+fmt(Math.max(...drives)):'')+'</small></div><div><b>'+o.pen+'</b><small>golpes de penalidad</small></div></div>'+
   '<h3>Resultados</h3><div class="legend"><span><i style="background:#2a6f87"></i>eagle o mejor: '+o.res.e+'</span><span><i style="background:#9cc8de"></i>birdie: '+o.res.b+'</span><span><i style="background:#cfd8c9"></i>par: '+o.res.p+'</span><span><i style="background:#f0d9a8"></i>bogey: '+o.res.o+'</span><span><i style="background:#c9961c"></i>doble o peor: '+o.res.o2+'</span></div>';
  const ck=Object.keys(o.clubs).sort((a,b)=>CLUBS.indexOf(a)-CLUBS.indexOf(b)); if(ck.length) h+='<h3>Distancia por palo (GPS)</h3><div class="tw"><table class="sc"><thead><tr><th>Palo</th><th>Golpes</th><th>Media</th><th>Máx.</th></tr></thead><tbody>'+ck.map(c=>{ const a=o.clubs[c]; return '<tr><td>'+CLUBN[c]+'</td><td>'+a.length+'</td><td>'+fmt(avg(a))+' m</td><td>'+fmt(Math.max(...a))+' m</td></tr>'; }).join('')+'</tbody></table></div>';
  h+='<p class="note">Greens en regulación: llegar al green en el par menos dos golpes (se calcula con los putts). Calles: con la marca ←/✓/→ del hoyo o, si hay golpes GPS, donde quedó el drive según el mapa del campo. Scrambling: hacer par o mejor sin haber cogido el green en regulación.</p>'; return h; }
VIEWS.stats=()=>{ setTop(CD.title,'Mis estadísticas'); if(!SURF) surfLoad().then(s=>{ if(s&&ST.view==='stats') render(); });
  const R=Object.values(allRounds()).filter(r=>!r.solo).sort((a,b)=>(a.created||0)-(b.created||0)); const names={}; for(const r of R) for(const p of r.p) names[p.n]=(names[p.n]||0)+(p.dev===DEV?100:1);
  const list=Object.keys(names).sort((a,b)=>names[b]-names[a]); if(!list.length) return '<div class="card"><h2>Estadísticas</h2><p class="note">Cuando juegues partidas aparecerán aquí tus medias y tu evolución.</p></div>'; const nm=ST.statName&&names[ST.statName]?ST.statName:list[0]; ST.statName=nm;
  const agg={holes:0,g:0,par:0,pu:0,puH:0,p3:0,p1:0,gir:0,girH:0,fw:0,fwH:0,fwL:0,fwR:0,scr:0,scrH:0,pen:0,drives:[],clubs:{},res:{e:0,b:0,p:0,o:0,o2:0},rounds:0}; const pts=[];
  for(const r of R){ const pi=r.p.findIndex(p=>p.n===nm); if(pi<0) continue; const o=statsOf(r,pi); if(!o.holes) continue; agg.rounds++; for(const k of ['holes','g','par','pu','puH','p3','p1','gir','girH','fw','fwH','fwL','fwR','scr','scrH','pen']) agg[k]+=o[k]; agg.drives.push(...o.drives); for(const c in o.clubs) (agg.clubs[c]=agg.clubs[c]||[]).push(...o.clubs[c]); for(const k in o.res) agg.res[k]+=o.res[k];
    const t=tot(r,pi); pts.push({d:r.created,v:o.g-o.par,full:o.holes===CD.courses[r.c].holes.length,stb:t.pts,c:CD.courses[r.c].short||CD.courses[r.c].name}); }
  return '<div class="card"><div class="chips" style="margin-bottom:10px">'+list.slice(0,8).map(n=>'<button class="chip'+(n===nm?' on':'')+'" data-nm="'+esc(n)+'">'+esc(n)+'</button>').join('')+'</div><h2>'+esc(nm)+' · '+agg.rounds+' partida'+(agg.rounds===1?'':'s')+'</h2>'+(agg.rounds?'<p class="note">Media por vuelta de 18: '+fmt((agg.g-agg.par)/Math.max(1,agg.holes)*18,1)+' golpes sobre el par.</p>'+statsHTML(agg,0):'')+'</div>'+
   (pts.length>1?'<div class="card"><h2>Evolución</h2>'+chart(pts)+'</div>':''); };
WIRE.stats=()=>{ document.querySelectorAll('[data-nm]').forEach(b=>b.onclick=()=>{ ST.statName=b.dataset.nm; render(); }); };
// score over par of each game, oldest to newest (full rounds dark, unfinished light)
function chart(P){ const W=640, H=220, L=40, B=34, T=14, R=12; const vs=P.map(p=>p.v); let lo=Math.min(0,...vs), hi=Math.max(...vs,1); const pad=Math.max(2,(hi-lo)*0.15); lo-=pad; hi+=pad;
  const X=i=>L+(W-L-R)*(P.length===1?0.5:i/(P.length-1)), Y=v=>T+(H-T-B)*(hi-v)/(hi-lo);
  let s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Golpes sobre el par por partida">'; const step=Math.max(1,Math.round((hi-lo)/5));
  for(let v=Math.ceil(lo/step)*step; v<=hi; v+=step){ const y=Y(v); s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" stroke="'+(v===0?'#59665d':'#d7ddd2')+'" stroke-width="'+(v===0?1.4:1)+'"/><text x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end">'+(v>0?'+':'')+v+'</text>'; }
  s+='<polyline fill="none" stroke="#255d3c" stroke-width="2.5" points="'+P.map((p,i)=>X(i)+','+Y(p.v)).join(' ')+'"/>';
  P.forEach((p,i)=>{ s+='<circle cx="'+X(i)+'" cy="'+Y(p.v)+'" r="5" fill="'+(p.full?'#255d3c':'#ffffff')+'" stroke="#255d3c" stroke-width="2"><title>'+new Date(p.d).toLocaleDateString('es-ES')+' · '+p.c+' · '+(p.v>0?'+':'')+p.v+'</title></circle>'; if(P.length<=12) s+='<text x="'+X(i)+'" y="'+(H-B+16)+'" text-anchor="middle">'+new Date(p.d).toLocaleDateString('es-ES',{day:'numeric',month:'short'})+'</text>'; });
  return s+'</svg><div class="legend"><span><i class="l" style="background:#255d3c"></i>golpes sobre el par (bruto) en cada partida</span><span><i style="background:#255d3c"></i>vuelta completa</span><span><i style="background:#fff;outline:2px solid #255d3c"></i>vuelta sin terminar</span><span><i class="l" style="background:#59665d"></i>el par</span></div>'; }

/* G2: the plan before playing and my distances */
VIEWS.plan=()=>{ setTop(CD.title,'Plan de los hoyos'); const C=CD.courses[ST.pc]||CD.courses[0], tees=courseTees(C); if(!tees.includes(ST.pt)) ST.pt=LS.get(KEY+'_plantee_'+C.id)||C.tee||tees[0]||''; if(!tees.includes(ST.pt)) ST.pt=tees[0]||''; ST.ph=Math.min(ST.ph,C.holes.length-1);
  const H=CD.holes[C.holes[ST.ph]], tee=teeOf(H,ST.pt), dh=elevAt(H.g[0],H.g[1])-elevAt(tee[0],tee[1]);
  return '<div class="card"><h2>Antes de jugar</h2><p class="note">Elige recorrido, barras y hoyo. El plan reparte el hoyo en golpes con <b>tus distancias</b> (pestaña Mis palos), cuenta el desnivel real y el viento, y lo enseña sobre la foto aérea. «Ver el vuelo del hoyo en 3D» abre el juego y vuela del tee al green con las caídas de tu plan marcadas.</p>'+
   (CD.courses.length>1?'<div class="lbl" style="margin-top:8px">Recorrido</div><div class="chips" style="margin:6px 0 4px">'+CD.courses.map((c,i)=>'<button class="chip'+(ST.pc===i?' on':'')+'" data-pc="'+i+'">'+esc(c.name)+'</button>').join('')+'</div>':'')+
   (tees.length>1?'<div class="lbl" style="margin-top:8px">Barras</div><div class="chips" style="margin:6px 0 4px">'+tees.map(t=>'<button class="chip'+(ST.pt===t?' on':'')+'" data-pt2="'+esc(t)+'">'+esc(t)+'</button>').join('')+'</div>':'')+windHTML()+'</div>'+
   '<div class="card"><div class="hstrip">'+C.holes.map((hi,k)=>'<button data-h="'+k+'" class="'+(k===ST.ph?'on':'')+'">'+CD.holes[hi].n+'</button>').join('')+'</div><div class="hole-h"><b>Hoyo '+H.n+'</b><span>Par '+H.par+(H.hcp?' · Hcp '+H.hcp:'')+' · '+fmt(tee[2])+' m · '+(Math.abs(dh)<1?'llano':(dh>0?'sube ':'baja ')+fmt(Math.abs(dh))+' m')+'</span></div>'+(H.info?'<p class="note" style="margin:6px 0 10px">'+esc(H.info)+'</p>':'<div style="height:8px"></div>')+planHTML(H,tee,ST.pt,true).replace('<button class="btn small" id="planT">Ocultar</button>','')+
   '<div class="row" style="margin-top:10px"><button class="btn small" id="pPrev">‹ Hoyo anterior</button><button class="btn small primary" id="pNext">Hoyo siguiente ›</button></div></div>'; };
WIRE.plan=()=>{ const C=CD.courses[ST.pc]||CD.courses[0], q=s=>document.querySelectorAll(s); windWire();
  q('[data-pc]').forEach(b=>b.onclick=()=>{ ST.pc=+b.dataset.pc; ST.ph=0; ST.pt=''; render(); }); q('[data-pt2]').forEach(b=>b.onclick=()=>{ ST.pt=b.dataset.pt2; LS.set(KEY+'_plantee_'+C.id,ST.pt); render(); });
  q('[data-h]').forEach(b=>b.onclick=()=>{ ST.ph=+b.dataset.h; render(); }); $('pPrev').onclick=()=>{ ST.ph=(ST.ph+C.holes.length-1)%C.holes.length; render(); }; $('pNext').onclick=()=>{ ST.ph=(ST.ph+1)%C.holes.length; render(); };
  const H=CD.holes[C.holes[ST.ph]]; planWire({c:ST.pc,sh:{}},ST.ph,teeOf(H,ST.pt)); };
VIEWS.bag=()=>{ setTop(CD.title,'Mis distancias'); const B=bagNow(), man=jget('vg_bagman',{}), mx=Math.max(...CLUBS.map(c=>B.d[c]),1); let nS=0; for(const c in B.samples) nS+=B.samples[c].length;
  return '<div class="card"><h2>Lo que haces con cada palo</h2><p class="note">Sale de tus <b>golpes con GPS</b>: en cada partida, elige el palo y pulsa «Golpe aquí» junto a la bola. Cada golpe se pasa a <b>metros en llano y sin viento</b> (se descuenta lo que subía o bajaba y el viento de ese momento) y de cada palo se toma el golpe normal: la media de los que quedan a menos de un 20 % de la mediana, para que no cuenten los fallos ni los medios golpes. Hay <b>'+nS+'</b> '+(nS===1?'golpe medido':'golpes medidos')+' en este móvil.</p>'+
   '<div class="bag">'+CLUBS.map(c=>{ const t=B.typ[c], s=B.src[c]; return '<div class="bagr"><div class="bn"><b>'+CLUBN[c]+'</b><small>'+SRC[s][0]+(t?' · '+t.n+(t.n===1?' golpe':' golpes')+(t.k>1?' · de '+fmt(t.lo)+' a '+fmt(t.hi)+' m':''):'')+'</small></div><div class="bb"><i style="width:'+Math.round(B.d[c]*100/mx)+'%;background:'+SRC[s][1]+'"></i></div><input data-bm="'+c+'" type="number" min="0" max="350" step="1" value="'+B.d[c]+'" aria-label="Distancia de '+CLUBN[c]+' en metros"></div>'; }).join('')+'</div>'+
   '<div class="legend" style="margin-top:10px">'+Object.keys(SRC).map(k=>'<span><i style="background:'+SRC[k][1]+';border-radius:3px"></i>'+({gps:'GPS: tres golpes buenos o más',mix:'GPS con uno o dos golpes, mezclado con la estimada',man:'puesta a mano por ti',est:'estimada: la escalera tipo ajustada a tus palos medidos'})[k]+'</span>').join('')+'</div>'+
   '<p class="note" style="margin-top:8px"><b>Cómo leerlo:</b> la barra y el número son los metros totales (vuelo y rodada) de un golpe normal en llano. Escribe en la casilla para fijar tú la distancia de un palo; bórrala o pon 0 para volver a la del GPS. Estas son las distancias que usan el caddie y el plan del hoyo, aquí y en el juego 3D.</p>'+
   (Object.keys(man).length?'<div class="row" style="margin-top:8px"><button class="btn small" id="bagClr">Quitar mis ajustes a mano</button></div>':'')+'</div>'; };
WIRE.bag=()=>{ document.querySelectorAll('[data-bm]').forEach(i=>i.onchange=()=>{ const man=jget('vg_bagman',{}), v=Math.round(+i.value||0); if(v>=10&&v<=350) man[i.dataset.bm]=v; else delete man[i.dataset.bm]; LS.set('vg_bagman',JSON.stringify(man)); BAGC=null; render(); });
  const b=$('bagClr'); if(b) b.onclick=()=>{ LS.set('vg_bagman','{}'); BAGC=null; render(); toast('Vuelven las distancias del GPS'); }; };

/* the guide */
VIEWS.guide=()=>{ setTop(CD.title,'Cómo funciona'); return '<div class="card"><h2>Qué es</h2><p>Una tarjeta de golf para jugar de verdad en '+esc(CD.courses.map(c=>c.name).join(', '))+' con tus amigos: cada uno ve en su móvil los resultados de todos al momento y quién va ganando, con el formato y el hándicap que elijáis. Con el GPS te dice a cuánto estás del green y guarda dónde pegas cada golpe; luego puedes ver tus estadísticas y la vuelta en 3D en el juego.</p></div>'+
  '<div class="card"><h2>Cómo se usa</h2><ol><li><b>Crear partida:</b> recorrido, formato, jugadores (nombre, hándicap y barras) y marca quién eres tú.</li><li><b>Invitar:</b> en Más → Invitar sale un código, un QR y un enlace. Quien lo abre se une y elige su nombre.</li><li><b>Apuntar:</b> en Hoyo, con + y − para cada jugador (cualquiera puede apuntar a todos, como el marcador de GameBook). Putts, calle y penalidades son opcionales, pero dan las estadísticas.</li><li><b>Cómo va:</b> la clasificación al momento (puntos, golpes netos o estado del match).</li><li><b>Golpes GPS:</b> antes de cada golpe, <b>Golpe aquí</b> junto a tu bola (y el palo, si quieres); en el green, <b>Bola en green</b>. Al apuntar los putts, tu resultado se rellena solo.</li><li><b>Terminar:</b> en Más → Terminar la partida. Queda en el Historial de todos los móviles, con tarjeta, estadísticas, mapa de golpes y la vuelta en 3D.</li></ol>'+
  '<p class="note">Sin cobertura no pasa nada: todo se guarda en el móvil y se envía cuando vuelve la conexión. La partida viaja cifrada con su código; no se guarda en ningún servidor, solo en los móviles de quienes juegan (por eso existe «Guardar archivo» como copia).</p></div>'+
  '<div class="card"><h2>El GPS</h2><p class="note">Las distancias al green (delante, centro, fondo) se miden desde tu posición hasta el contorno del green del mapa del campo. La precisión de un móvil suele ser de 3 a 5 m; el círculo azul del mapa la enseña. En el Mapa, toca un punto para saber cuánto hay hasta él y de ahí al green. Para que los golpes salgan bien, pulsa con el móvil junto a la bola. «Pantalla siempre encendida» evita que se apague durante la vuelta (gasta más batería).</p></div>'+
  '<div class="card"><h2>Mis distancias, caddie y plan</h2><ol><li><b>Mis palos:</b> la distancia normal de cada palo, sacada de tus golpes con GPS (elige el palo antes de pulsar «Golpe aquí»). Puedes fijar cualquiera a mano.</li><li><b>Caddie:</b> en Hoyo, debajo de las distancias al green, dice cuánto «juega» el golpe desde donde estás y qué palo coger; si no llegas, dónde dejarla.</li><li><b>Viento:</b> automático (el parte del momento en el campo, se renueva cada 10 minutos), a mano (velocidad y de dónde viene) o sin viento.</li><li><b>Plan del hoyo:</b> en Hoyo y en la pestaña Plan (antes de jugar): los golpes del tee al green con tus palos, sobre la foto aérea, y el vuelo del hoyo en 3D con las caídas marcadas.</li></ol><p class="note">Las cuentas: cada metro que sube el golpe juega un metro más (y al revés); el viento en contra suma un 0,6 % de la distancia por cada km/h y a favor resta un 0,3 %; el cruzado mueve la bola un 0,35 % por km/h. Es una ayuda orientativa, como la de un caddie: tú decides.</p></div>'+
  '<div class="card"><h2>Glosario</h2><dl class="gl"><dt>Juega como</dt><dd>Los metros que hay que pegar para llegar: la distancia real corregida por el desnivel y el viento. 150 m cuesta arriba y con viento en contra pueden jugar como 165.</dd><dt>Mi distancia</dt><dd>Lo que haces con un palo en un golpe normal, en llano y sin viento (vuelo más rodada).</dd><dt>Golpe de colocación</dt><dd>Cuando no llegas al green: el golpe a la calle que te deja una distancia cómoda para el siguiente.</dd><dt>En regulación</dt><dd>Llegar al green en el par menos dos golpes; el plan dice si con tus distancias sale.</dd><dt>Hándicap (exacto)</dt><dd>Tu nivel oficial: los golpes de más que sueles hacer sobre el par.</dd><dt>Hándicap de juego</dt><dd>Los golpes que recibes en este recorrido y barras: hándicap × Slope / 113 + (CR − par), por el porcentaje elegido.</dd><dt>Slope y CR</dt><dd>La dificultad oficial de unas barras: el CR (Course Rating) es lo que haría un jugador scratch y el Slope cuánto más difícil es para uno de hándicap alto (113 es la media).</dd><dt>Hcp del hoyo</dt><dd>Orden de dificultad (1 el más difícil). Con hándicap de juego 10 recibes un golpe (•) en los hoyos de Hcp 1 a 10.</dd><dt>Neto</dt><dd>Golpes menos los que recibes.</dd><dt>Stableford</dt><dd>2 puntos por el par neto, 3 por birdie neto, 4 por eagle neto, 1 por bogey neto, 0 si haces más.</dd><dt>Medal</dt><dd>Se cuentan todos los golpes: neto (menos el hándicap) o scratch (sin hándicap).</dd><dt>Match play</dt><dd>Hoyo a hoyo: gana el hoyo quien hace menos golpes netos. «3 y 2» es ganar con tres de ventaja cuando quedan dos; A/S, igualados.</dd><dt>Mejor bola por parejas</dt><dd>En cada hoyo cuenta el mejor resultado (en puntos Stableford) de cada pareja.</dd><dt>Green en regulación</dt><dd>Llegar al green en el par menos dos golpes (en un par 4, en dos).</dd><dt>Calle cogida</dt><dd>Que el golpe de salida de un par 4 o 5 quede en la calle.</dd><dt>Scrambling</dt><dd>Hacer par o mejor sin haber cogido el green en regulación.</dd><dt>Penalidad</dt><dd>Golpe de castigo (agua, fuera de límites, bola injugable).</dd></dl></div>'+
  '<div class="card"><h2>Colores de la tarjeta</h2><div class="legend"><span><i style="background:#fff;outline:2px solid #2a6f87"></i>birdie</span><span><i style="background:#2a6f87"></i>eagle o mejor</span><span><i style="background:#fff;outline:2px solid #c9961c;border-radius:2px"></i>bogey</span><span><i style="background:#c9961c;border-radius:2px"></i>doble bogey o peor</span><span><i style="background:#c9961c"></i>• golpe que recibes</span></div></div>'; };

let toastT=0; function toast(t){ const el=$('toast'); el.textContent=t; el.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'),2600); }

  const q=new URLSearchParams(location.search), sala=q.get('sala'); const act=LS.get(KEY+'_ronda_activa'); const A=act&&allRounds()[act];

boot();
})();
